<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MNIST CNN with Denoiser</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis"></script>
  <script src="data-loader.js"></script>
  <script src="app.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    button { margin: 5px; padding: 10px 20px; }
    #logs { white-space: pre-wrap; border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: scroll; }
    canvas { border: 1px solid #000; margin: 5px; }
  </style>
</head>
<body>
  <h1>MNIST CNN with Denoiser</h1>
  <button id="loadDataBtn">Load Data</button>
  <button id="trainBtn">Train CNN</button>
  <button id="trainDenoiserBtn">Train Denoiser</button>
  <button id="predictBtn">Predict Sample</button>

  <div id="logs"></div>
  <div id="predictions"></div>
  <div id="accuracyChart"></div>
</body>
</html>
