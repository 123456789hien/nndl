<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Demand Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.0.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Hotel Demand Dashboard</h1>
  </header>

  <section id="data-section">
    <h2>1. Load Data</h2>
    <input type="file" id="train-file" accept=".csv">
    <input type="file" id="test-file" accept=".csv">
    <button id="load-data-btn">Load CSV</button>
    <div id="load-status"></div>
  </section>

  <section id="eda-section">
    <h2>2. EDA & Overview</h2>
    <button id="run-eda-btn" disabled>Run EDA</button>
    <div id="overview"></div>
    <div id="missing-table"></div>
    <canvas id="correlation-heatmap"></canvas>
    <canvas id="cancellation-time"></canvas>
    <canvas id="price-hist"></canvas>
  </section>

  <section id="model-section">
    <h2>3. Load Model & Predict</h2>
    <input type="file" id="model-json" accept=".json">
    <input type="file" id="model-weights" accept=".bin">
    <button id="load-model-btn">Load Model</button>
    <div>
      <label for="hotel-select">Hotel:</label>
      <select id="hotel-select"></select>
      <label for="year-input">Year:</label>
      <input type="number" id="year-input" value="2022">
      <label for="month-input">Month:</label>
      <input type="number" id="month-input" value="1" min="1" max="12">
      <label for="smoothing-slider">Smoothing:</label>
      <input type="range" id="smoothing-slider" min="0" max="1" step="0.05" value="0.2">
      <span id="smoothing-value">0.2</span>
      <button id="predict-btn">Predict</button>
    </div>
    <div id="prediction-result"></div>
    <div id="insight-box"></div>
    <canvas id="history-chart"></canvas>
  </section>

  <script src="data-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
