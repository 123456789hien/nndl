<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Booking Dashboard & Prediction</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
</head>
<body>
<header>
    <h1>Hotel Booking Dashboard & Prediction</h1>
</header>

<section id="data-load">
    <h2>1. Data Load</h2>
    <input type="file" id="train-file" accept=".csv">
    <input type="file" id="test-file" accept=".csv">
    <button id="load-data-btn">Load CSV</button>
    <div id="data-status">Waiting for CSV upload...</div>
    <div id="merge-overview"></div>
    <div id="missing-values"></div>
    <div id="stats-table"></div>
</section>

<section id="eda">
    <h2>2. EDA Visuals</h2>
    <label for="smoothing-slider">Smoothing Window: <span id="smoothing-value">1</span></label>
    <input type="range" id="smoothing-slider" min="1" max="6" value="1">
    <canvas id="cancellation-line-chart"></canvas>
    <canvas id="avg-price-histogram"></canvas>
    <canvas id="correlation-heatmap"></canvas>
</section>

<section id="train-model">
    <h2>3. Train LSTM Model</h2>
    <button id="train-btn">Train Model (Browser)</button>
    <div id="train-status">Model not trained yet.</div>
    <button id="download-model-btn" disabled>Download Model (.json + .bin)</button>
</section>

<section id="predict">
    <h2>4. Predict Cancellation Rate</h2>
    <input type="file" id="upload-model-file" accept=".json">
    <select id="hotel-dropdown"></select>
    <input type="number" id="predict-year" placeholder="Year" min="2017" max="2025">
    <input type="number" id="predict-month" placeholder="Month" min="1" max="12">
    <button id="predict-btn">Predict</button>
    <canvas id="predict-chart"></canvas>
    <div id="insight-box"></div>
</section>

<script src="data-loader.js"></script>
<script src="app.js"></script>
</body>
</html>
