<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Booking Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>Hotel Booking Dashboard</h1>

    <!-- File Upload -->
    <div class="upload-section">
      <label>Train CSV:</label>
      <input type="file" id="train-file" accept=".csv">
      <label>Test CSV:</label>
      <input type="file" id="test-file" accept=".csv">
      <label>Model JSON:</label>
      <input type="file" id="model-json" accept=".json">
      <label>Model BIN:</label>
      <input type="file" id="model-bin" accept=".bin">
      <button id="btn-load">Load & Prepare Data</button>
      <p id="note-load"></p>
    </div>

    <!-- Interpolation / Smoothing -->
    <div class="controls">
      <label for="interp-method">Interpolation / Smoothing:</label>
      <select id="interp-method">
        <option value="none">None</option>
        <option value="ffill">Forward Fill</option>
        <option value="linear">Linear</option>
      </select>

      <label for="group-key">Group Key:</label>
      <select id="group-key">
        <option value="room_type">Room Type</option>
        <option value="meal_plan">Meal Plan</option>
        <option value="market_segment">Market Segment</option>
      </select>
    </div>

    <!-- Merge & Overview (show 10 lines only) -->
    <div class="overview-section">
      <h2>Merge & Overview (first 10 lines)</h2>
      <div id="merge-overview"></div>
    </div>

    <!-- Charts -->
    <div class="charts-section">
      <h2>Visuals</h2>
      <canvas id="chart-cancel"></canvas>
      <canvas id="chart-price"></canvas>
      <canvas id="chart-predict"></canvas>
    </div>
  </div>

  <script src="data-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
