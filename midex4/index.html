<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Booking Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@1.1.0/dist/chartjs-chart-matrix.min.js"></script>
</head>
<body>
<header>
  <h1>Hotel Booking Demand Dashboard</h1>
</header>

<section class="upload-section">
  <h2>Step 1: Load Data</h2>
  <input type="file" id="trainCSV" accept=".csv">
  <input type="file" id="testCSV" accept=".csv">
  <button id="loadData">Load Data</button>
  <span id="loadStatus"></span>
</section>

<section class="eda-section">
  <h2>Step 2: EDA</h2>
  <div id="mergeOverview"></div>
  <div id="missingValues"></div>
  <div id="stats"></div>
  <canvas id="correlationHeatmap" width="600" height="400"></canvas>
  <canvas id="cancellationTime" width="600" height="400"></canvas>
  <canvas id="priceHist" width="600" height="400"></canvas>
  <label>Smoothing Slider: <input type="range" id="smoothingSlider" min="0" max="5" step="1" value="0"></label>
</section>

<section class="train-section">
  <h2>Step 3: Train Model (Browser)</h2>
  <button id="trainModelBtn">Train LSTM</button>
  <span id="trainStatus"></span>
  <button id="downloadModel">Download Model</button>
</section>

<section class="predict-section">
  <h2>Step 4: Predict Cancellation Rate</h2>
  <select id="hotelDropdown"></select>
  <input type="number" id="inputYear" placeholder="Year" min="2018" max="2025">
  <input type="number" id="inputMonth" placeholder="Month" min="1" max="12">
  <button id="predictBtn">Predict</button>
  <div id="predictionResult"></div>
  <canvas id="predictionChart" width="600" height="400"></canvas>
  <div id="insightBox"></div>
</section>

<script src="data-loader.js"></script>
<script src="app.js"></script>
</body>
</html>
