<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Demand EDA & Prediction</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <div class="container">
    <h1>🏨 Hotel Demand Analysis Dashboard</h1>

    <section class="upload-section">
      <h2>📂 Upload CSV Data</h2>
      <input type="file" id="trainFile" accept=".csv" />
      <input type="file" id="testFile" accept=".csv" />
      <button id="loadBtn">Load Data</button>
      <p id="loadStatus"></p>
    </section>

    <section id="overview" class="card hidden">
      <h2>📊 Merge & Overview Table</h2>
      <div id="dataTable"></div>
    </section>

    <section id="stats" class="card hidden">
      <h2>📈 Dataset Statistics</h2>
      <div id="statsTable"></div>
    </section>

    <section id="eda" class="card hidden">
      <h2>🔍 Exploratory Data Analysis</h2>
      <canvas id="corrHeatmap" height="300"></canvas>
      <canvas id="lineChart" height="200"></canvas>
      <canvas id="histChart" height="200"></canvas>
    </section>

    <section id="train" class="card hidden">
      <h2>🤖 Train Model (Simulated LSTM)</h2>
      <label>Smoothing factor: <input type="range" id="smoothSlider" min="0" max="1" step="0.05" value="0.5"></label>
      <button id="trainBtn">Train Model</button>
      <p id="trainStatus"></p>
    </section>

    <section id="predict" class="card hidden">
      <h2>🔮 Predict Cancellation Risk</h2>
      <label>Hotel:
        <select id="hotelSelect"></select>
      </label>
      <label>Year:
        <input type="number" id="yearInput" value="2018" />
      </label>
      <label>Month:
        <input type="number" id="monthInput" value="6" min="1" max="12" />
      </label>
      <button id="predictBtn">Predict</button>
      <div id="predictionResult" class="insight-box"></div>
      <canvas id="predChart" height="200"></canvas>
    </section>
  </div>

  <script src="data-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
