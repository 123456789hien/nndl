<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GRU Stock Prediction Demo (TF.js)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; color: #222; }
    #controls { display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    #accuracy-container, #timeline-container { margin-top: 16px; }
    progress { width: 300px; height: 18px; }
    button { padding: 6px 12px; cursor: pointer; }
    input[type="file"] { padding: 6px; }
    h2 { margin-top: 0; }
  </style>
</head>
<body>
  <h2>GRU Stock Prediction Demo (client-side, TF.js)</h2>
  <div id="controls">
    <input id="csv-file" type="file" accept=".csv" />
    <button id="btn-load">Load CSV</button>
    <button id="btn-train" disabled>Train Model</button>
    <button id="btn-download">Save Model</button>
    <progress id="progress" value="0" max="100"></progress>
    <div id="status">Idle</div>
  </div>

  <div id="accuracy-container"></div>
  <div id="timeline-container"></div>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>

  <!-- Main app module -->
  <script type="module">
    import App from './app.js';
    // initialize app and expose for debugging
    const app = App.initFromDOM();
    window._APP = app;
    // Helpful message
    console.log('App initialized. Use the file input to load CSV then Train Model.');
  </script>
</body>
</html>
